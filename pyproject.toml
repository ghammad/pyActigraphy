[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pyactigraphy"
dynamic = ["version", "readme"]
requires-python = ">=3.9,<3.13"
description='Analysis package for actigraphy data'


[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "pyActigraphy"
authors = [
    {name = "Grégory Hammad", email = "gregory.hammad@hotmail.fr"},
]
description = "Analysis package for actigraphy data"
dynamic = ["version", "readme"]
requires-python = ">=3.9,<3.13"
keywords = ["actigraphy", "actimetry", "analysis", "python", "open-source"]
license = "GNU GPL-3.0"
license-files = ["LICENSE.md"]
classifiers = [  # Optional
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 5 - Production/Stable",

    # Indicate who your project is intended for
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",

    # Pick your license as you wish
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",

    # Specify the Python versions you support here. In particular, ensure
    # that you indicate whether you support Python 2, Python 3 or both.
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests",
    'importlib-metadata; python_version<"3.10"',
]
dependencies = [
  "joblib",
  "lmfit",
  "pandas>=2.0.0,<3",
  "plotly",
  "numba",
  "numpy",
  "pyexcel",
  "pyexcel-ods3",
  "pyexcel-xlsx",
  "pytz", "scipy",
  "spm1d",
  "statsmodels>=0.10"
]

[tool.setuptools.dynamic]
version = {attr = "pyActigraphy.__version__"}  # any module attribute compatible with ast.literal_eval
readme = {file = ["README.rst"], content-type = "text/x-rst"}

[project.urls]
Homepage = "https://github.com/ghammad/pyActigraphy"
Documentation = "https://ghammad.github.io/pyActigraphy/"
Repository = "https://github.com/ghammad/pyActigraphy"
Issues = "https://github.com/ghammad/pyActigraphy/issues"